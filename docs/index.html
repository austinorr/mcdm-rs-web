<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Promethee II Demo</title>
    <script src="./enable-threads.js"></script>
    <script type="module" crossorigin src="./assets/index-BPezJK5_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Buy01UxS.css">
  </head>
  <body>
    <!-- Sticky top nav -->
    <nav id="top-nav">
      <div class="container">
        <span id="nav-title">Promethee II</span>
        <button id="compute_prom_ii">Compute Promethee II</button>
      </div>
    </nav>

    <div class="container">
      <div>
        <div
          id="load_data_buttons"
          style="display: flex; align-items: center; gap: 0.5em"
        >
          <select id="demo-select">
            <option value="" disabled selected>Load demo data...</option>
            <option value="vehicle_demo">Vehicle demo (CSV)</option>
            <option value="10">Random 10</option>
            <option value="1000">Random 1,000</option>
            <option value="10000">Random 10,000</option>
            <option value="50000">Random 50,000</option>
          </select>
        </div>

        <!-- Unified alternatives loader: drag file or paste URL -->
        <div id="upload-zone" class="upload-zone">
          <p>
            Drag &amp; drop a file or paste a URL (CSV, JSON, GeoJSON, TopoJSON)
          </p>
          <input
            type="file"
            id="alt-file-input"
            accept=".csv,.json,.geojson,.topojson"
          />
          <div
            id="alt-url-bar"
            style="
              display: flex;
              gap: 0.5em;
              margin-top: 0.5em;
              justify-content: center;
            "
          >
            <input
              type="text"
              id="alt-url-input"
              placeholder="https://..."
              style="
                width: 400px;
                padding: 0.4em;
                border: 1px solid #ccc;
                border-radius: 4px;
              "
            />
            <button
              id="alt-url-btn"
              style="padding: 0.4em 1em; font-size: 0.9em"
            >
              Load
            </button>
          </div>
        </div>

        <!-- Map (shown when spatial data is loaded) -->
        <div
          id="map-wrapper"
          style="display: none; margin: 1em 0; padding: 0 20px"
        >
          <div id="map-controls" style="margin-bottom: 0.5em"></div>
          <div
            id="map-container"
            style="height: 500px; border-radius: 8px; overflow: hidden"
          ></div>
        </div>

        <!-- Criteria CSV upload (shown after alternatives are loaded) -->
        <div
          id="criteria-upload-zone"
          class="upload-zone"
          style="display: none"
        >
          <p>Drag &amp; drop a criteria CSV here, or click to browse</p>
          <input type="file" id="criteria-file-input" accept=".csv" />
        </div>

        <div id="data_summary"></div>
      </div>

      <!-- Display columns picker + results -->
      <div id="unused-columns" style="display: none; margin: 1em 0"></div>
      <div id="results_table"></div>
    </div>

    <!-- Help modal (native <dialog>) -->
    <dialog id="help-modal">
      <div class="modal-header">
        <h2>Preference Function Guide</h2>
        <button id="help-modal-close" class="modal-close">&times;</button>
      </div>
      <div id="help-modal-body" class="modal-body"></div>
    </dialog>
  </body>
</html>
